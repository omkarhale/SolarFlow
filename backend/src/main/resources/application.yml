spring:
  application:
    name: solarflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/solarflow}
    username: ${DB_USERNAME:solarflow}
    password: ${DB_PASSWORD:1234567}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

solarflow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:7}
    jwt-secret: ${JWT_SECRET:solarflow-dev-secret-change-before-any-shared-deployment-32}
    cookie-secure: ${COOKIE_SECURE:false}
  demo-data: ${DEMO_DATA:true}
  storage-dir: ${STORAGE_DIR:storage}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
