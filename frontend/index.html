<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14243A" />
    <meta
      name="description"
      content="SolarFlow helps rooftop solar companies manage enquiries, quotations, installations, and payments."
    />
    <title>SolarFlow</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('solarflow.theme')
          if (!raw) return
          var saved = JSON.parse(raw)
          if (saved.kind === 'preset' && saved.id) {
            document.documentElement.setAttribute('data-theme', saved.id)
          }
          if (saved.kind === 'custom' && saved.vars) {
            document.documentElement.setAttribute('data-theme', 'custom')
            Object.keys(saved.vars).forEach(function (key) {
              document.documentElement.style.setProperty(key, saved.vars[key])
            })
          }
        } catch (error) {
          /* keep the default theme */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
